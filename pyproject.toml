[project]
name = "purifeye"
version = "0.1.0"
description = "PurifEye: River Plastic Bottle Detection Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "ai-edge-litert>=2.3.0",
]

[project.scripts]
prepare = "prepare_yolo_dataset:main"
train = "train_yolo:main"
evaluate = "evaluate:main"
export = "export_models:main"
pipeline = "pipeline:main"
app = "app.main:main"
realtime = "realtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
